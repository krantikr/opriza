name: Email sync cron

# Drives email ingestion on a schedule by calling the backend's cross-org poll
# endpoint. This replaces the in-process scheduler, which cannot be relied on
# when the host sleeps while idle. The call also wakes a sleeping host.
#
# Note on timing: GitHub's scheduler is best-effort and often runs a few
# minutes late or coalesces runs under load, so the real cadence is looser than
# the 5 minutes below. That is fine here - each desk's own crawl window decides
# whether it is actually checked on a given tick, so a late tick changes
# nothing. If you need strict 5-minute timing, drive the same endpoint from
# cron-job.org instead.
on:
  schedule:
    - cron: "*/5 * * * *"
  # Lets you trigger a sync by hand from the Actions tab to test the setup.
  workflow_dispatch:

# If one run overruns into the next window, don't pile them up.
concurrency:
  group: email-sync-cron
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll tick
        env:
          # Set these two as repository secrets (Settings > Secrets and
          # variables > Actions):
          #   API_BASE_URL  e.g. https://quotation-copilot-api.onrender.com
          #   CRON_SECRET   the same value as the backend's CRON_SECRET
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_BASE_URL and CRON_SECRET repo secrets must be set." >&2
            exit 1
          fi
          # A sleeping free host can take ~60s to cold-start, so allow a
          # generous connect timeout before giving up. The endpoint returns 202
          # immediately once awake; the actual sweep runs in the background.
          code=$(curl --silent --show-error \
            --connect-timeout 90 --max-time 120 \
            --retry 2 --retry-delay 10 \
            --output /dev/stderr --write-out "%{http_code}" \
            -X POST "${API_BASE_URL%/}/api/v1/pipeline/cron" \
            -H "X-Cron-Secret: ${CRON_SECRET}")
          echo "HTTP ${code}"
          # 202 = accepted. Treat anything else as a failure so the run is
          # flagged red in the Actions tab.
          [ "$code" = "202" ]
